{% extends 'account/_base.html' %}
{% load i18n %}
{% block title %}{% translate "Password changed" %}{% endblock %}
{% block content_auth_form %}
  <div class="account-status">
    <div class="account-status__icon account-status__icon--success">
      <svg class="account-status__glyph" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h1 class="account-title">{% translate "All done!" %}</h1>
    <p class="account-status__text">{% translate "Your password has been changed." %}</p>
    <a href="{% url 'index' %}" class="account-btn account-btn--inline">
      {% translate "Back to home" %}
    </a>
  </div>
{% endblock content_auth_form %}
