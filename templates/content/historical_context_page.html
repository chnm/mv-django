{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/prose.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/content.css' %}">
{% endblock %}

{% block title %}{{ page.title }} - Mapping Early Modern Violence{% endblock %}

{% block content %}
    <div class="content-page content-page--bare">
        <div class="content-container">
            <div class="content-header">
                <h1 class="content-title content-title--plain">{{ page.title }}</h1>
            </div>

            <div class="prose prose-lg prose-gray content-prose">
                {{ page.content|safe }}
            </div>
        </div>
    </div>
{% endblock content %}
