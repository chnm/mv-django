{% extends "base.html" %}
{% load static %}

{% block title %}Preview: {{ content.title }}{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/prose.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages/home.css' %}">
{% endblock %}

{% block content %}
    <div class="home-preview">
        <div class="prose home-preview__prose">
            <h1 class="home-preview__title">{{ content.title }}</h1>
            <div class="home-preview__lede">{{ content.lede }}</div>
            <div class="content">{{ content.main_content|safe }}</div>
        </div>
    </div>
{% endblock %}
